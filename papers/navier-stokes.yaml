review_pipeline: proof_algebra
hypotheses:
  - "The paper's parameter table (page 14, preceding equation (4.1)) fixes a small exponent h and defines the tangential-velocity growth exponent A = 1/2 + h and the axial-length exponent D = 1/2 − h, both used throughout the self-similar profile construction. These two definitions must sum to exactly 1: A + D = 1."
  - "Equation (5.1) writes the pressure coefficient profile as p_n = q^(-2A+λn) * Π_n, using the radial-mode exponent λ_n = 2*n*h from the parameter table together with A = 1/2 + h from the same table. Substituting these two definitions, the combined exponent -2*A + λ_n must simplify to exactly -1 + 2*h*(n-1)."
  - "Section 10.4's viscosity-rescaling argument (equations (10.22)-(10.23)) extends the viscosity-one construction to every positive viscosity ν by setting v(y,t) = ν^(-1/2) * v_ν(sqrt(ν)*y, t). The paper states this gives the L2-norm scaling relation ||v(t)||_2^2 = ν^(-5/2) * ||v_ν(t)||_2^2. This combined exponent -5/2 must equal the sum of the amplitude-squaring exponent (-1, from squaring the ν^(-1/2) prefactor) and the exponent contributed by the volume element under the substitution y = sqrt(ν)*x in three spatial dimensions (-3/2): -1 + (-3/2) = -5/2."
