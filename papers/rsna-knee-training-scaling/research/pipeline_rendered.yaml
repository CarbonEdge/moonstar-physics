  version: "1.0"
  description: Read public sources, synthesize cross-source evidence, expert panel, red team, decision.

transforms:
  - name: reader_bend_the_knee_to_dinov3_ensembled
    type: LlmTransform
    config:
      model: "deepseek/deepseek-v4-flash"
      max_tokens: 2500
      timeout_seconds: 600
      reasoning: {enabled: false}
      system: |
        You are a research analyst reading ONE source: a public Kaggle notebook from a competition on knee-MRI abnormality detection (12 findings, mean AUC). Extract, faithfully and without inventing anything: (1) the headline claim and any score it reports, with the version/evidence; (2) every concrete technique (architecture, input design, slice counts, resolution, preprocessing, label handling, loss, aggregation, blending/routing weights, TTA) with the numbers given; (3) any ablation or measured effect size, quoted; (4) what resources it attaches (datasets/weights) and what it requires to reproduce; (5) the author's own warnings or caveats; (6) your confidence that each technique is a real cause of score (SUPPORTED by an ablation / ASSERTED / UNCLEAR). Use compact bullets. Quote numbers exactly.

        Your input JSON has a key "sources" mapping source names to their text. Analyse ONLY the source named `bend-the-knee-to-dinov3-ensembled` and ignore the others.
